services:
  - type: web
    name: labipa-multiplayer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_GUEST
        value: true
      - key: ENABLE_LIVE_EDIT
        value: true
    autoDeploy: true
