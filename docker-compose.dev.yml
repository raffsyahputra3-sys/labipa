// docker-compose.dev.yml — Postgres 16 + Redis 7 untuk dev (Sprint 1 / C.3)
//   docker compose -f docker-compose.dev.yml up -d
//   $env:DATABASE_URL='postgres://labipa:dev@localhost:5432/labipa'
//   $env:REDIS_URL='redis://localhost:6379'
//   node scripts/migrate.js
version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labipa
      POSTGRES_USER: labipa
      POSTGRES_PASSWORD: dev
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
